<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control de Depósitos · Conteo de almacén</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Terminal de aduanas: barra de funciones arriba, paneles densos tipo libro registro, cifras en monoespaciada.
   Dark-first (ámbar sobre negro cálido); tema claro equivalente en tinta sobre papel. */
:root{
  --bg:#0d0c0a; --panel:#15130f; --panel2:#1c1914; --line:#2c281f; --line2:#3a3428;
  --fg:#ece6d8; --dim:#a39a86; --mute:#6f6758;
  --amber:#ffb000; --amber-ink:#1a1200; --amber-soft:rgba(255,176,0,.12);
  --dep:#58c48a; --dep-soft:rgba(88,196,138,.13);
  --des:#ec6f53; --des-soft:rgba(236,111,83,.13);
  --pue:#5bb2e0; --pue-soft:rgba(91,178,224,.13);
  --sc:#c39bff; --sc-soft:rgba(195,155,255,.13);
  --warn:#ffd25a;
  --ui:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:3px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f6f5f1; --panel:#ffffff; --panel2:#efede6; --line:#dcd7ca; --line2:#c8c1b0;
  --fg:#1b1913; --dim:#5d574a; --mute:#8b8474;
  --amber:#a86a00; --amber-ink:#ffffff; --amber-soft:rgba(168,106,0,.10);
  --dep:#1d7f4c; --dep-soft:rgba(29,127,76,.10);
  --des:#b23a22; --des-soft:rgba(178,58,34,.09);
  --pue:#1f6f9c; --pue-soft:rgba(31,111,156,.10);
  --sc:#6d3fc4; --sc-soft:rgba(109,63,196,.09);
  --warn:#8a6100; color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f6f5f1; --panel:#ffffff; --panel2:#efede6; --line:#dcd7ca; --line2:#c8c1b0;
  --fg:#1b1913; --dim:#5d574a; --mute:#8b8474;
  --amber:#a86a00; --amber-ink:#ffffff; --amber-soft:rgba(168,106,0,.10);
  --dep:#1d7f4c; --dep-soft:rgba(29,127,76,.10);
  --des:#b23a22; --des-soft:rgba(178,58,34,.09);
  --pue:#1f6f9c; --pue-soft:rgba(31,111,156,.10);
  --sc:#6d3fc4; --sc-soft:rgba(109,63,196,.09);
  --warn:#8a6100; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui);margin:0}
#app{padding-inline:16px;padding-block:0 48px;max-width:1480px;margin:0 auto}
.mono,code,td.n,td.v,input.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
a{color:var(--amber)}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top1{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px 6px}
.brand{font-weight:700;letter-spacing:.14em;font-size:13px;text-transform:uppercase;display:flex;align-items:baseline;gap:8px}
.brand b{color:var(--amber)}
.brand span{color:var(--mute);font-weight:500;letter-spacing:.08em}
.tick{font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap;flex:1;min-width:0}
.tick i{font-style:normal;color:var(--fg)}
.tick em{font-style:normal;color:var(--amber)}
.tick span{white-space:nowrap}
.save{font-family:var(--mono);font-size:11px;padding:3px 8px;border:1px solid var(--line2);border-radius:var(--r);color:var(--dim);white-space:nowrap}
.save.ok{color:var(--dep);border-color:color-mix(in srgb,var(--dep) 45%,transparent)}
.save.ro{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.fk{display:flex;gap:2px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
.fk::-webkit-scrollbar{display:none}
.fk button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:7px 11px 8px;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.fk button kbd{font-family:var(--mono);font-size:10.5px;color:var(--amber-ink);background:var(--mute);padding:0 4px;border-radius:2px;margin-right:6px}
.fk button:hover{color:var(--fg)}
.fk button[aria-current="page"]{color:var(--amber);border-bottom-color:var(--amber)}
.fk button[aria-current="page"] kbd{background:var(--amber)}

/* ---------- estructura ---------- */
.view{display:none;padding-top:18px}
.view.on{display:block}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.vh h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em;text-wrap:balance}
.vh p{margin:3px 0 0;color:var(--dim);max-width:72ch;font-size:13.5px}
.lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.box>.bh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line)}
.box>.bh h2,.box>.bh h3{margin:0;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.box>.bb{padding:12px}
.box>.bb.flush{padding:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.muted{color:var(--dim)} .tiny{font-size:12px} .amber{color:var(--amber)}

/* ---------- depósitos (panel) ---------- */
.dep{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;padding:14px 14px 10px}
.dep .big{font-family:var(--mono);font-size:52px;line-height:.95;font-weight:700;color:var(--amber);grid-row:span 2}
.dep .big small{display:block;font-size:11px;font-family:var(--ui);font-weight:600;letter-spacing:.14em;color:var(--mute);margin-top:6px;text-transform:uppercase}
.dep h2{margin:0;font-size:16px;letter-spacing:.06em;font-weight:600}
.dep .meta{font-family:var(--mono);font-size:11.5px;color:var(--dim);line-height:1.6}
.nx{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.nx span{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line2);padding:2px 7px;border-radius:var(--r);color:var(--dim)}
.nx span b{color:var(--fg);font-weight:500}

/* barra de saldo */
.lr{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(90px,1fr) 64px;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.lr .nm{min-width:0}
.lr .nm b{font-weight:600}
.lr .nm div{font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;background:var(--panel2);border-radius:1px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--amber)}
.bar.blk i{background:var(--warn);opacity:.7}
.lr .q{font-family:var(--mono);text-align:right;font-size:15px;font-weight:700}
.lr .q small{display:block;font-size:10.5px;color:var(--mute);font-weight:400}

/* ---------- tablas ---------- */
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);font-weight:600;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:5px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th.n,td.n{text-align:right}
td.n{white-space:nowrap}
tbody tr:hover td{background:var(--panel2)}
tr.sel td{background:var(--amber-soft)!important}
tr.sub td{color:var(--dim);font-size:11.5px;border-bottom-style:dashed}
tr.tot td{font-weight:700;border-top:1px solid var(--line2)}
tr.ent td{background:color-mix(in srgb,var(--amber) 6%,transparent)}
tr.fin td{background:var(--dep-soft);font-weight:700}
td.vin{font-family:var(--mono);white-space:nowrap;letter-spacing:.02em}
td.vin b{color:var(--amber);font-weight:700}
.scroll{max-height:66vh;overflow:auto;border-top:1px solid var(--line)}

/* ---------- estados ---------- */
.st{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:2px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.DEP{color:var(--dep);background:var(--dep-soft)}
.st.DES{color:var(--des);background:var(--des-soft)}
.st.PUE{color:var(--pue);background:var(--pue-soft)}
.st.SC{color:var(--sc);background:var(--sc-soft)}
.st.BLK{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.flag{color:var(--warn);font-family:var(--mono);font-size:11px;cursor:help}
.chip{display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line2);border-radius:var(--r);padding:2px 8px;background:var(--panel)}
.chip b{font-weight:700}

/* ---------- controles ---------- */
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;letter-spacing:.02em}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.pri{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);color:var(--amber-ink)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 10px;cursor:pointer;font-size:12.5px;color:var(--dim);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--amber-soft);color:var(--amber)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600;min-width:0}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:6px 8px;min-width:0;width:100%;font-size:13px}
textarea{font-family:var(--mono);font-size:12px;min-height:150px;resize:vertical;line-height:1.55}
input.mono{letter-spacing:.02em}
.fr{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:var(--r)}
.qty button{background:transparent;border:0;width:26px;height:26px;cursor:pointer;color:var(--amber);font-family:var(--mono);font-size:15px}
.qty span{font-family:var(--mono);min-width:26px;text-align:center;font-weight:700}

/* ---------- salida / bloques ---------- */
.out{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto;margin:0}
.note{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent);padding:8px 11px;font-size:13px;border-radius:0 var(--r) var(--r) 0}
.note.bad{border-left-color:var(--des);background:var(--des-soft)}
.note.ok{border-left-color:var(--dep);background:var(--dep-soft)}
.note.info{border-left-color:var(--pue);background:var(--pue-soft)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:7px 10px;cursor:pointer;color:var(--dim);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber)}
.det{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:13px}
.det dt{color:var(--mute);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.det dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-word}
.empty{padding:22px;text-align:center;color:var(--dim)}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:6px;max-width:min(420px,calc(100vw - 32px))}
.toast div{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--amber);padding:9px 12px;border-radius:var(--r);font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.toast div.ok{border-left-color:var(--dep)} .toast div.bad{border-left-color:var(--des)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{max-width:560px;width:100%;max-height:85vh;overflow:auto}
.ro-banner{margin-top:12px}
details.nt summary{cursor:pointer;color:var(--warn);font-size:12px;list-style:none}
details.nt summary::-webkit-details-marker{display:none}
details.nt p{margin:4px 0 0;font-size:12px;color:var(--dim);max-width:70ch}

@media (max-width:900px){ .g2,.g3{grid-template-columns:minmax(0,1fr)} .dep .big{font-size:42px} .tick{flex-basis:100%;order:3} }
@media (max-width:520px){ .lr{grid-template-columns:minmax(0,1fr) 56px} .lr .bar{grid-column:1/-1;order:3} .tick{font-size:11px;gap:10px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

</head>
<body>
<div id="app">
  <header class="top">
    <div class="top1">
      <div class="brand"><b>CONTROL</b> DE DEPÓSITOS <span>ALMACÉN · DEPÓSITO ADUANERO</span></div>
      <div class="tick" id="tick"><span>Cargando estado…</span></div>
      <span class="save" id="saveState">—</span>
    </div>
    <nav class="fk" id="nav" aria-label="Secciones">
      <button data-v="panel" aria-current="page"><kbd>1</kbd>Panel</button>
      <button data-v="stock"><kbd>2</kbd>Stock</button>
      <button data-v="cuadros"><kbd>3</kbd>Cuadros</button>
      <button data-v="despacho"><kbd>4</kbd>Despacho</button>
      <button data-v="llegada"><kbd>5</kbd>Llegada · puerto</button>
      <button data-v="aeat"><kbd>6</kbd>Conciliación AEAT</button>
      <button data-v="valores"><kbd>7</kbd>Valores</button>
      <button data-v="fuentes"><kbd>8</kbd>Fuentes y datos</button>
    </nav>
  </header>
  <div id="roBanner" class="ro-banner" hidden></div>
  <section class="view on" id="v-panel"><div class="empty">Cargando el estado de los depósitos…</div></section>
  <section class="view" id="v-stock"></section>
  <section class="view" id="v-cuadros"></section>
  <section class="view" id="v-despacho"></section>
  <section class="view" id="v-llegada"></section>
  <section class="view" id="v-aeat"></section>
  <section class="view" id="v-valores"></section>
  <section class="view" id="v-fuentes"></section>
  <div class="toast" id="toast" aria-live="polite"></div>
  <div id="modalHost"></div>

  host.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="box"><div class="bh"><h3>${esc(title)}</h3></div><div class="bb stack">${bodyHtml}<div class="row" style="justify-content:flex-end" id="mAct"></div></div></div></div>`;
  const act=$('#mAct');
  const close=()=>{host.innerHTML='';};
  (actions||[{label:'Cerrar'}]).forEach(a=>{ const b=document.createElement('button'); b.className='btn '+(a.cls||''); b.textContent=a.label; b.onclick=async()=>{ if(a.fn){ b.disabled=true; const keep=await a.fn(); if(keep===true){b.disabled=false;return;} } close(); }; act.appendChild(b); });
  $('.modal',host).addEventListener('click',e=>{ if(e.target.classList.contains('modal')) close(); });
  setTimeout(()=>{ const b=act.querySelector('button:last-child'); b&&b.focus(); },20);
}

/* ---------- guardado ---------- */
function setReadOnly(){
  READONLY=true; setSave('ro','Solo lectura');
  const b=$('#roBanner'); b.hidden=false;
  b.innerHTML='<div class="note">Vista de solo lectura: puedes consultar stock y cuadros y generar los textos de despacho, pero no registrar movimientos. Pide acceso de edición al artifact para guardar.</div>';
  renderAll();
}
async function guardar(motivo){
  S.generado=new Date().toISOString();
  S.log=S.log||[]; S.log.unshift({t:S.generado,txt:motivo});
  if(S.log.length>400) S.log.length=400;
  if(MODE==='artifact'){
    if(!ART && artReady){ try{ await artReady; }catch(e){} }
    if(!ART){ setReadOnly(); toast('Esta vista no puede guardar cambios.','bad'); return false; }
    setSave('','Guardando…');
    try{
      await ART.publish({'data/estado.json':{content:JSON.stringify(S),contentType:'application/json'}});
      setSave('ok','Guardado '+hora()); return true;
    }catch(e){
      const c=e&&e.code;
      if(c==='conflict'){ toast('Otra persona guardó antes que tú. La página se recarga con su versión; repite la operación.','bad'); setSave('','Recargando…'); return false; }
      if(['not_writer','not_granted','capability_disabled','not_declared','consent_required','capability_removed'].includes(c)){ setReadOnly(); return false; }
      if(c==='rate_limited'){ toast('Demasiados guardados seguidos. Espera unos segundos y repite.','bad'); setSave('','Sin guardar'); return false; }
      toast('No se ha podido guardar ('+(c||'error')+'). Repite la operación.','bad'); setSave('','Sin guardar'); return false;
    }
  }
  try{ localStorage.setItem(KEY,JSON.stringify({seed:SEED_ID,estado:S})); setSave('ok','Guardado en este navegador · '+hora()); return true; }
  catch(e){ toast('El navegador no permite guardar aquí. Exporta el estado desde Fuentes y datos.','bad'); return false; }
}
async function commit(motivo,mutator){
  if(READONLY){ toast('Vista de solo lectura: no se puede registrar.','bad'); return false; }
  const prev=JSON.stringify(S);
  try{ mutator(S); }catch(e){ S=JSON.parse(prev); toast('Error al aplicar: '+e.message,'bad'); return false; }
  const ok=await guardar(motivo);
  if(!ok){ S=JSON.parse(prev); }
  renderAll(); return ok;
}

/* ---------- descargas ---------- */
async function saveFile(name,data){
  if(MODE==='artifact'){
    if(!DL && dlReady){ try{ await dlReady; }catch(e){} }
    if(!DL){ toast('Las descargas no están disponibles en esta vista.','bad'); return; }
    try{ await DL.save({filename:name,data}); }catch(e){ if(e&&e.code==='declined') return; toast('Descarga no realizada ('+(e&&e.code||'error')+').','bad'); }
    return;
  }
  const blob=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}

function filtraVeh(){
  const q=FS.q.trim().toUpperCase();
  return S.vehiculos.filter(v=>{
    if(FS.dep&&v.deposito!==FS.dep) return false;
    if(FS.dos&&v.dossier!==FS.dos) return false;
    if(FS.mod&&v.modelo!==FS.mod) return false;
    if(FS.est==='ACT'&&!(v.estado==='DEP'||v.estado==='SC')) return false;
    if(FS.est&&FS.est!=='ACT'&&v.estado!==FS.est) return false;
    if(q&&!(v.vin.includes(q)||(v.color||'').includes(q))) return false;
    return true;
  });
}

function ledger(d){ // filas del cuadro, recalculadas
  const ks=Object.keys(d.modelos); const rows=[];
  let bal={}; ks.forEach(k=>bal[k]=d.modelos[k].uds);
  const totVals=u=>ks.reduce((a,k)=>sumVals(a,vals(d.modelos[k],u[k]||0)),{});
  if(d.puerto){ rows.push({tipo:'puerto',lab:'DESPACHO PUERTO',ss:'',dossier:d.puerto.dossier,dua:d.puerto.dua,uds:d.puerto.uds,v:totVals(d.puerto.uds),bal:null}); }
  const ent={}; ks.forEach(k=>ent[k]=d.modelos[k].uds);
  rows.push({tipo:'ent',lab:'S/ENTRADA '+(d.sEntrada||''),ss:'',dossier:d.id,dua:d.dvd,uds:ent,v:totVals(ent),bal:{...bal},bv:totVals(bal)});
  d.salidas.forEach(s=>{ ks.forEach(k=>bal[k]-=(s.uds[k]||0)); rows.push({tipo:'sal',s,lab:'SALIDA '+s.n,ss:s.ss,dossier:s.dossier,dua:s.dua,fecha:s.fecha,uds:s.uds,v:totVals(s.uds),bal:{...bal},bv:totVals(bal)}); });
  rows.push({tipo:'fin',lab:'EN DEPÓSITO',uds:{...bal},v:totVals(bal),bal:{...bal},bv:totVals(bal)});
  return rows;
}

function cuadroAoA(d){
  const ks=Object.keys(d.modelos); const L=ledger(d);

  const out=[[`${d.id} · ${d.titulo} · ${S.depositos[d.deposito].nombre} · DVD ${d.dvd||''} · S/E ${d.sEntrada||''}`],[],H];
  L.forEach(r=>{
    ks.forEach((k,j)=>{
      const n=(r.uds&&r.uds[k])||0; if(r.tipo==='sal'&&!n&&ks.length>1) return;
      const v=vals(d.modelos[k],n); const b=r.bal?vals(d.modelos[k],r.bal[k]):null;
      out.push([j===0||ks.length===1?r.lab:'', j===0?(r.ss||''):'', j===0?(r.dossier||''):'', j===0?(r.dua||''):'', j===0?fdate(r.fecha):'', d.modelos[k].nombre, n, r2(v.pb), r2(v.pn), r2(v.imp), r2(v.tte), r2(v.seg), r2(v.thc), r2(v.t3), r2(v.plast), '',
        b?b.uds:'', b?r2(b.pb):'', b?r2(b.pn):'', b?r2(b.imp):'', b?r2(b.tte):'', b?r2(b.seg):'', b?r2(b.thc):'', b?r2(b.t3):'', b?r2(b.plast):'']);
    });
  });
  return out;
}

const DS={items:[],errs:[],txt:'',grp:{},tab:'cuadro',done:null};
function addItemVin(vin,via){
  const v=vehByVin(vin);
  if(DS.items.some(i=>i.vin===vin)) return {ok:false,msg:`${vin}: repetido en la solicitud.`};
  if(!v){ const h=S.historicoVin.find(x=>x[0]===vin); return {ok:false,msg:h?`${vin}: ya datado (DVD saldado ${h[1]}, DUA ${h[4]}).`:`${vin}: no figura en ningún depósito.`}; }
  if(v.estado==='DES'){ const s=salidaDe(v); return {ok:false,msg:`${vin}: ya despachado${s?` en S/S ${s.ss||'(s/n)'} · dossier ${s.dossier||'—'}`:''}.`}; }
  if(v.estado==='PUE') return {ok:false,msg:`${vin}: se despachó en puerto, nunca entró en depósito.`};
  const d=dossier(v.dossier);
  const yaN=DS.items.filter(i=>i.dossier===d.id&&i.modelo===v.modelo).length;
  if(yaN+1>saldo(d,v.modelo)) return {ok:false,msg:`${vin}: el saldo de ${d.id} ${v.modelo} es ${saldo(d,v.modelo)} y ya hay ${yaN} seleccionados.`};
  DS.items.push({vin,dossier:d.id,modelo:v.modelo,via});
  return {ok:true};
}
function parseSolicitud(txt){
  const up=txt.toUpperCase(); const found=[...new Set(up.match(VINRX)||[])];
  const errs=[]; let added=0;
  found.forEach(vin=>{ if(!vinCheck(vin)&&!vehByVin(vin)){ errs.push(`${vin}: dígito de control incorrecto; revisa si está bien copiado.`); return; } const r=addItemVin(vin,'bastidor'); r.ok?added++:errs.push(r.msg); });
  // terminaciones sueltas (5–8 caracteres) que identifiquen un único vehículo activo
  const rest=up.replace(VINRX,' ');
  const toks=[...new Set((rest.match(/\b[A-HJ-NPR-Z0-9]{5,8}\b/g)||[]).filter(t=>/\d{4}/.test(t)))];
  toks.forEach(t=>{ const c=S.vehiculos.filter(v=>(v.estado==='DEP'||v.estado==='SC')&&v.vin.endsWith(t));
    if(c.length===1){ const r=addItemVin(c[0].vin,'terminación '+t); r.ok?added++:errs.push(r.msg); }
    else if(c.length>1) errs.push(`Terminación ${t}: coincide con ${c.length} vehículos; usa el bastidor completo.`); });
  if(!found.length&&!toks.length) errs.push('No he encontrado bastidores en el texto.');
  return {added,errs};
}
function grupos(){ // un grupo por dossier de entrada (una S/Salida por DVD, como en los cuadros)
  const g={}; DS.items.forEach(i=>{ (g[i.dossier]=g[i.dossier]||[]).push(i); });
  const ids=Object.keys(g).sort((a,b)=>{const da=dossier(a),db=dossier(b);return da.deposito.localeCompare(db.deposito)||a.localeCompare(b);});
  Object.keys(DS.grp).forEach(id=>{ if(!g[id]) delete DS.grp[id]; });
  ids.forEach(id=>{ if(DS.grp[id]) return; const dep=dossier(id).deposito;
    let top=nextSS(dep)-1;
    Object.keys(DS.grp).forEach(o=>{ if(dossier(o).deposito!==dep) return; const s=ssNum(DS.grp[o].ss); if(s&&s.y===YEAR) top=Math.max(top,s.n); });
    DS.grp[id]={ss:(top+1)+'/'+YEAR,dossier:'',fecha:hoy(),dua:'',prov:''};
  });
  return ids.map(id=>({d:dossier(id),items:g[id],f:DS.grp[id]}));
}
function grupoVals(G){ const d=G.d; const u={}; G.items.forEach(i=>u[i.modelo]=(u[i.modelo]||0)+1);
  const per=Object.keys(u).map(k=>({k,m:d.modelos[k],n:u[k],v:vals(d.modelos[k],u[k]),antes:saldo(d,k),despues:saldo(d,k)-u[k]}));

function docDespacho(G,tab){

    if(!vinCheck(vin)) errs.push(`${vin}: dígito de control incorrecto.`);

    if(/NO\s+LIBERAR|NI\s+VINCULAR/.test(l)) dest='NO'; else if(/LIBERAR|DESPACHAR|PUERTO/.test(l)) dest='PUE'; else if(/DEP[OÓ]SITO|D\.A\.|DVD|CIUDAD B|DEPA|DEPB/.test(l)) dest='DEP';

    ks.forEach(k=>L.push(`${(LS.mods[k].marca||'')+' '+k}\t${line(vals(LS.mods[k],1))}`));
    L.push('',`S/ENTRADA: ${LS.sEntrada}\t${line(tot('DEP'))}\t\t${line(tot('DEP'))}`,`DOSSIER ${LS.dossier}`);
    return L.join('\n'); }
  if(tab==='puerto'||tab==='dvd'){
    const dest=tab==='puerto'?'PUE':'DEP'; const D=S.depositos[LS.deposito];
    const L=[tab==='puerto'?`DESPACHO A CONSUMO EN PUERTO (importación directa)`:`ENTRADA EN DEPÓSITO ADUANERO · DVD`,

    let any=false;

      L.push(`Partida ${m.partida||'(confirmar)'} · ${(m.marca||'')+' '+k} · ${n} uds`,`  PB ${fkg(v.pb)} kg · PN ${fkg(v.pn)} kg`,`  Importe ${f2(v.imp)} ${m.mon.imp} · Flete ${f2(v.tte)} ${m.mon.tte} · Seguro ${f2(v.seg)} ${m.mon.seg}`,`  THC ${f2(v.thc)} € · T-3 ${f2(v.t3)} €${tab==='puerto'?' → base IVA':''}${v.plast?' · Plástico '+fkg(v.plast)+' kg':''}`,
        `  Bastidores: ${LS.filas.filter(f=>f.modelo===k&&f.dest===dest).map(f=>f.vin).join(', ')}`,''); });
    if(!any) return tab==='puerto'?'Ningún bastidor marcado para despacho en puerto.':'Ningún bastidor marcado para depósito.';
    const t=tot(dest); L.push(`TOTAL ${t.uds} uds · PB ${fkg(t.pb)} kg · THC ${f2(t.thc)} € · T-3 ${f2(t.t3)} €`);
    if(tab==='puerto') L.push('Recuerda: THC y T-3 de puerto suelen facturarse por contenedor; aquí van prorrateados por vehículo como en los cuadros.');
    return L.join('\n'); }
  if(tab==='listas') return ['PUE','DEP','NO'].map(dst=>{ const fs=LS.filas.filter(f=>f.dest===dst); return `${{PUE:'DESPACHO EN PUERTO',DEP:'A DEPÓSITO '+LS.deposito,NO:'NO LIBERAR NI VINCULAR'}[dst]} (${fs.length})\n`+fs.map(f=>`${f.vin}  ${f.modelo}  ${f.color}`).join('\n'); }).join('\n\n');
  return '';
}

const AS={rows:null,res:null,err:'',fuente:''};
function normMRN(s){ return String(s||'').replace(/^(DVD|DUA)\s*/i,'').replace(/\s+/g,'').trim(); }
function parseAeatRows(aoa){
  let hi=aoa.findIndex(r=>r.some(c=>/chasis/i.test(String(c)))); if(hi<0) throw new Error('No encuentro la columna «Chasis». Usa el Excel tal como lo exporta la AEAT.');
  const H=aoa[hi].map(c=>String(c).trim().toLowerCase());
  const ix=n=>H.findIndex(h=>h.startsWith(n));
  const iM=ix('documento'), iD=ix('identific'), iC=ix('chasis'), iMa=ix('marca'), iMo=ix('modelo'), iDa=H.findIndex(h=>h==='datado'), iDoc=ix('doc. datado')>=0?ix('doc. datado'):ix('doc');
  const out=[]; aoa.slice(hi+1).forEach(r=>{ const vin=String(r[iC]||'').trim().toUpperCase(); if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)) return;
    const dat=String(r[iDa]||'').trim().toLowerCase(); out.push({mrn:normMRN(r[iM]),dep:String(r[iD]||'').trim(),vin,marca:String(r[iMa]||'').trim(),modelo:String(r[iMo]||'').trim(),est:dat.startsWith('dat')?'D':'P',dua:normMRN(r[iDoc])}); });
  if(!out.length) throw new Error('El fichero no contiene bastidores válidos.');
  return out;
}
function conciliar(rows){
  const depMap={'ESDEMOTU5ABYK8':'DEPA','ESDEMO27L52RE0':'DEPB'};
  const res={ok:[],resuelve:[],conflicto:[],desconocido:[],faltan:[]}; const vistos=new Set();
  rows.forEach(r=>{ vistos.add(r.vin); const v=vehByVin(r.vin);
    if(!v){ res.desconocido.push({r}); return; }
    if(v.estado==='SC'){ res.resuelve.push({r,v}); return; }
    if((r.est==='P'&&v.estado==='DEP')||(r.est==='D'&&v.estado==='DES')) res.ok.push({r,v}); else res.conflicto.push({r,v}); });
  const deps=new Set(rows.map(r=>depMap[r.dep]).filter(Boolean));
  S.vehiculos.forEach(v=>{ if(deps.has(v.deposito)&&(v.estado==='DEP')&&!vistos.has(v.vin)) res.faltan.push({v}); });
  return res;
}

    ${[...R.conflicto.map(x=>['DES','Discrepa',x]),...R.resuelve.map(x=>['SC','Resuelve',x]),...R.faltan.map(x=>['DEP','Falta en AEAT',x]),...R.desconocido.map(x=>['PUE','No está en la app',x])].map(([c,l,x])=>`<tr><td class="vin">${vinHtml((x.r||x.v).vin)}</td><td><span class="st ${c}">${l}</span></td><td>${x.v?ESTADOS[x.v.estado]:'—'}</td><td>${x.r?(x.r.est==='D'?'Datado':'Pendiente'):'—'}</td><td class="mono tiny">${esc(x.r?x.r.dua:'')}</td><td class="mono tiny">${esc(x.r?x.r.mrn:'')}</td></tr>`).join('')}
    </tbody></table></div></div>`:''}`;
  $('#aRun').onclick=async()=>{
    AS.err='';
    try{
      const f=$('#aFile').files[0]; let aoa=null;
      if(f){ if(/\.(xlsx|xls)$/i.test(f.name)){ const X=await loadXLSX(); const wb=X.read(await f.arrayBuffer(),{type:'array'}); aoa=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}); }
        else { const t=await f.text(); aoa=t.split(/\r?\n/).map(l=>l.split(/\t|;/)); } AS.fuente=f.name; }
      else { const t=$('#aTxt').value; if(!t.trim()) throw new Error('Carga un fichero o pega las filas.'); aoa=t.split(/\r?\n/).map(l=>l.split(/\t|;/)); if(!aoa.some(r=>r.some(c=>/chasis/i.test(c)))) aoa.unshift(['Documento MRN','Identificacion deposito','Chasis','Marca','Modelo','Datado','Doc. Datado']); AS.fuente='Texto pegado'; }
      AS.rows=parseAeatRows(aoa); AS.res=conciliar(AS.rows);
    }catch(e){ AS.err=e.message; AS.res=null; }
    rAeat();
  };
  const ap=$('#aApply'); if(ap) ap.onclick=async()=>{
    const n=AS.res.resuelve.length;
    const ok=await commit(`Conciliación AEAT (${AS.fuente}) · ${n} bastidores resueltos`,st=>{
      AS.res.resuelve.forEach(({r})=>{ const v=st.vehiculos.find(x=>x.vin===r.vin); const d=st.dossiers.find(x=>x.id===v.dossier);
        if(r.est==='P'){ v.estado='DEP'; v.conf='AEAT · '+AS.fuente; }
        else { v.estado='DES'; v.duaAeat=r.dua; const s=d.salidas.find(s=>s.dua&&normMRN(s.dua).startsWith(r.dua.split('/')[0].slice(0,18))); if(s){ v.salida=s.n; if(!s.vins.includes(v.vin)) s.vins.push(v.vin); } v.conf='AEAT · '+AS.fuente+(s?'':' (salida sin DUA en el cuadro)'); } });
    });
    if(ok){ toast(`${n} bastidores conciliados`,'ok'); AS.res=conciliar(AS.rows); rAeat(); }
  };
}

  $('#fJson').onclick=()=>saveFile('estado_almacen_'+hoy()+'.json',JSON.stringify(S,null,1));

async function boot(){
  const emb=document.getElementById('estado-embebido');
  try{
    if(emb){ MODE='embebido'; const seed=JSON.parse(emb.textContent); SEED_ID=seed.generado; S=seed;
      try{ const raw=localStorage.getItem(KEY); if(raw){ const p=JSON.parse(raw); if(p&&p.seed===SEED_ID&&p.estado&&p.estado.dossiers) S=p.estado; } }catch(e){}
      setSave('','Copia local');
    } else {
      const r=await fetch('data/estado.json',{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); S=await r.json(); MODE='artifact'; setSave('','Versión compartida');
      if(window.claude&&typeof window.claude.use==='function'){
        artReady=window.claude.use('artifact').then(a=>{ ART=a; if(!a){ setReadOnly(); } return a; },()=>{ setReadOnly(); });
        dlReady=window.claude.use('downloads').then(d=>{ DL=d; return d; },()=>null);
      } else { setReadOnly(); }
    }
  }catch(e){ $('#v-panel').innerHTML=`<div class="note bad">No se ha podido cargar el estado de los depósitos (${esc(e.message)}). Recarga la página; si persiste, abre la copia autónoma.</div>`; return; }
  S.log=S.log||[];
  const h=(location.hash||'').replace('#',''); renderTick();
  go(['panel','stock','cuadros','despacho','llegada','aeat','valores','fuentes'].includes(h)?h:'panel');
}

})();
